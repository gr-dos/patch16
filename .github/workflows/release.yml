name: release

# main only changes by merging a PR, so a push to main is a merge.
# If VERSION names a version without a tag, tag the merge commit and
# publish a release with patch.exe (the DOS command PATCH), its source,
# the source of the libc16 release linked into it, and the license notices
# attached (BUILDING.md, docs/GR-DOS.md).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # make fetches the pinned libc16 release (scripts/fetch-libc16) and
      # the Open Watcom snapshot it names.

      - name: Install DOSBox-X, QEMU and mtools
        if: steps.version.outputs.new == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x qemu-system-x86 mtools

      - name: Build and test
        if: steps.version.outputs.new == 'true'
        run: |
          make
          make test
          make test-grdos

      # patch16's source, the source of the libc16 release linked in, the
      # notices, and a description saying where the source is and how to
      # build it; then patch.exe built again from that source, the same.
      - name: Release files
        if: steps.version.outputs.new == 'true'
        run: |
          scripts/release-files build/release
          scripts/check-source build/release/patch16-$(cat VERSION)-src.tar.gz

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" patch.exe \
            "build/release/patch16-$VERSION-src.tar.gz" \
            build/release/libc16-*-src.tar.gz \
            build/release/LICENSE-libc16.txt \
            build/release/GPL-2.0.txt \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file build/release/notes.md \
            --generate-notes
